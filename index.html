<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tab Swapper</title>
</head>
<body>
    <script>
        window.onload = function() {
            // 1. Open the new blank tab
            let newTab = window.open("about:blank", "_blank", "");

            if (!newTab) {
                alert("Tab block detected! Please allow popups/redirects in your browser address bar.");
                return;
            }

            // 2. Build the DOM layout inside the new tab
            let container = newTab.document.createElement("div");
            container.style.cssText = "font-family: Arial, sans-serif; padding: 50px; text-align: center;";

            let heading = newTab.document.createElement("h1");
            heading.textContent = "Welcome to the New Tab";

            let paragraph = newTab.document.createElement("p");
            paragraph.textContent = "The original tab has been closed.";

            container.appendChild(heading);
            container.appendChild(paragraph);
            newTab.document.body.appendChild(container);

            // 3. Close the old tab immediately
            window.close();
        };
    </script>
</body>
</html>
