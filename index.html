<!DOCTYPE html>
<html>
<head>
  <title>Open in about:blank</title>
</head>
<body>
<script>
window.onload = () => {
  const tab = window.open("about:blank", "_blank");

  if (!tab) {
    alert("Please allow popups for this site.");
    return;
  }

  tab.document.open();
  tab.document.write(`
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Settings</title>
<style>
html,body,iframe{
  margin:0;
  width:100%;
  height:100%;
  border:0;
  overflow:hidden;
}
</style>
</head>
<body>
<iframe
  src="https://super-duper-zebra-vpx49jqq9p926p95-4321.app.github.dev/settings"
  allowfullscreen>
</iframe>
</body>
</html>
  `);
  tab.document.close();
};
</script>
</body>
</html>
